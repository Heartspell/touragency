spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/touragency}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:touragency}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:touragency123}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.port=${PORT:8080}

# i18n configuration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
