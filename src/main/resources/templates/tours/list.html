<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Каталог туров — TourKG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Page header -->
<div style="background:#fff;border-bottom:1px solid #E5E7EB;padding:24px 0;">
  <div class="container">
    <h1 style="font-size:1.6rem;font-weight:800;margin:0;color:#111827;">Каталог туров</h1>
    <div style="font-size:.88rem;color:#6B7280;margin-top:4px;">
      Найдено <strong th:text="${tours.size()}"></strong> туров
    </div>
  </div>
</div>

<div class="container" style="padding:32px 12px;">

    <div th:if="${tours != null and !#lists.isEmpty(tours)}" id="listCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner" style="max-height:280px;overflow:hidden;border-radius:12px;">
        <div th:each="t,iter : ${tours}" class="carousel-item" th:classappend="${iter.index == 0} ? ' active'">
          <img th:if="${t.coverImage != null}" th:src="@{/tours/{id}/cover(id=${t.id})}" th:attr="loading=${iter.index == 0} ? 'eager' : 'lazy'" decoding="async" class="d-block w-100" style="height:280px;object-fit:cover;" alt="">
          <div th:unless="${t.coverImage != null}" class="d-flex align-items-center justify-content-center" style="height:280px;background:#111827;color:#fff;">
            <span th:switch="${t.category.name()}">
              <span th:case="'BEACH'"><i data-lucide="umbrella" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
              <span th:case="'MOUNTAIN'"><i data-lucide="mountain" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
              <span th:case="'CITY'"><i data-lucide="building-2" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
              <span th:case="'ADVENTURE'"><i data-lucide="tent" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
              <span th:case="'CULTURAL'"><i data-lucide="landmark" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
              <span th:case="*"><i data-lucide="plane" style="width:40px;height:40px;color:#fff;opacity:.9;"></i></span>
            </span>
          </div>
          <div class="carousel-caption d-none d-md-block" style="background:rgba(0,0,0,0.25);border-radius:8px;padding:8px;">
            <h6 th:text="${t.title}">Title</h6>
            <p th:text="${t.destination}">Destination</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#listCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#listCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  <div class="row g-4">

    <!-- FILTERS -->
    <div class="col-lg-3">
      <div class="filter-card">
        <div class="filter-card-header">
          <i data-lucide="sliders-horizontal" style="width:16px;height:16px;margin-right:6px;"></i> Фильтры
        </div>
        <div class="filter-card-body">
          <form id="filterForm" th:action="@{/tours}" method="get">
            <div class="mb-3">
              <label class="filter-label">Направление</label>
              <input type="text" name="destination" class="filter-input" placeholder="Анталья, Дубай..." th:value="${filter.destination}">
            </div>
            <div class="mb-3">
              <label class="filter-label">Страна</label>
              <input type="text" name="country" class="filter-input" placeholder="Турция, Таиланд..." th:value="${filter.country}">
            </div>
            <div class="mb-3">
              <label class="filter-label">Категория</label>
              <select name="category" class="filter-input">
                <option value="">Все категории</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.name()}"
                        th:selected="${filter.category != null and filter.category == cat}"
                        th:text="${cat.name() == 'BEACH' ? 'Пляж' : cat.name() == 'MOUNTAIN' ? 'Горы' : cat.name() == 'CITY' ? 'Город' : cat.name() == 'ADVENTURE' ? 'Приключения' : cat.name() == 'CULTURAL' ? 'Культура' : cat.name()}">
                </option>
              </select>
            </div>
            <hr class="filter-divider">
            <div class="mb-3">
              <label class="filter-label">Цена от (сом)</label>
              <input type="number" name="minPrice" class="filter-input" placeholder="0" th:value="${filter.minPrice}">
            </div>
            <div class="mb-4">
              <label class="filter-label">Цена до (сом)</label>
              <input type="number" name="maxPrice" class="filter-input" placeholder="200 000" th:value="${filter.maxPrice}">
            </div>
            <button type="submit" class="btn-primary-tkg w-100 justify-content-center">Применить</button>
            <a th:href="@{/tours}" class="btn-ghost-tkg w-100 justify-content-center mt-2" style="font-size:.85rem;">Сбросить</a>
          </form>
        </div>
      </div>
    </div>

    <!-- TOUR GRID -->
    <div class="col-lg-9">
      <div th:if="${tours.empty}" class="tkg-alert tkg-alert-info">
        <i data-lucide="info" style="width:16px;height:16px;"></i>
        По вашему запросу туров не найдено. Попробуйте изменить фильтры.
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 cards-grid" id="tourGrid">
        <div class="col" th:each="tour : ${tours}">
          <a th:href="@{/tours/{id}(id=${tour.id})}" class="tour-card">
            <div class="tour-card-img">
              <img th:if="${tour.coverImage != null}" th:src="@{/tours/{id}/cover(id=${tour.id})}" loading="lazy" decoding="async" alt="">
              <span th:unless="${tour.coverImage != null}" th:switch="${tour.category.name()}">
                <span th:case="'BEACH'"><i data-lucide="umbrella" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
                <span th:case="'MOUNTAIN'"><i data-lucide="mountain" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
                <span th:case="'CITY'"><i data-lucide="building-2" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
                <span th:case="'ADVENTURE'"><i data-lucide="tent" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
                <span th:case="'CULTURAL'"><i data-lucide="landmark" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
                <span th:case="*"><i data-lucide="plane" style="width:56px;height:56px;color:#fff;opacity:.9;"></i></span>
              </span>
              <span class="tour-card-badge" th:text="${tour.durationDays} + ' дн.'"></span>
            </div>
            <div class="tour-card-body">
              <div class="tour-card-country" th:text="${tour.country}"></div>
              <div class="tour-card-title" th:text="${tour.title}"></div>
              <div class="tour-card-meta">
                <span><i data-lucide="map-pin" style="width:12px;height:12px;"></i> <span th:text="${tour.destination}"></span></span>
                <span th:if="${tour.reviewCount > 0}"><i data-lucide="star" style="width:12px;height:12px;color:#F59E0B;"></i> <span th:text="${#numbers.formatDecimal(tour.rating,1,'POINT',1,'POINT')}"></span> (<span th:text="${tour.reviewCount}"></span>)</span>
              </div>
              <div class="tour-card-footer">
                <div>
                  <div class="tour-card-price" th:text="${#numbers.formatDecimal(tour.price,0,'COMMA',0,'POINT')} + ' сом'"></div>
                  <div class="tour-card-price-label">за человека</div>
                </div>
                <div class="tour-card-btn">Подробнее</div>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/custom.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
