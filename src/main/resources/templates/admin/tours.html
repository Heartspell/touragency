<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление турами — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="padding:28px 12px;">
  <h1>Управление турами</h1>
  <div th:if="${successMsg}" class="tkg-alert-success" th:text="${successMsg}"></div>
  <div th:if="${errorMsg}" class="tkg-alert-error" th:text="${errorMsg}"></div>
  <div class="table-responsive mt-3">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>Заголовок</th><th>Оператор</th><th>Действия</th></tr>
      </thead>
      <tbody>
        <tr th:each="t : ${tours}">
          <td th:text="${t.id}"></td>
          <td th:text="${t.title}"></td>
          <td th:text="${t.operator?.fullName ?: '—'}"></td>
          <td>
            <a th:href="@{/admin/tours/{id}/images(id=${t.id})}" class="btn-ghost-tkg">Управлять изображениями</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/custom.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
