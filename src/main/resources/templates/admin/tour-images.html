<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Изображения тура</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" style="padding:28px 12px;">
  <a th:href="@{/admin/tours}" class="btn-ghost-tkg mb-3">← Все туры</a>
  <h2 th:text="${tour.title}">Тур</h2>
  <div th:if="${successMsg}" class="tkg-alert-success" th:text="${successMsg}"></div>
  <div th:if="${errorMsg}" class="tkg-alert-error" th:text="${errorMsg}"></div>

  <form th:action="@{/admin/tours/{id}/images(id=${tour.id})}" method="post" enctype="multipart/form-data" style="margin-top:16px;">
    <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}">
    <div class="mb-3">
      <label class="form-label">Добавить изображения</label>
      <input type="file" name="images" multiple accept="image/*" class="form-control">
    </div>
    <button type="submit" class="btn-accent-tkg">Загрузить</button>
  </form>

  <hr>
  <div class="row g-3 mt-3">
    <div class="col-6 col-md-3" th:each="img : ${images}">
      <div style="position:relative;">
        <img th:src="@{/tours/{tourId}/images/{imgId}(tourId=${tour.id},imgId=${img.id})}" loading="lazy" decoding="async" style="width:100%;height:160px;object-fit:cover;border-radius:8px;" alt="">
        <form th:action="@{/admin/tours/{id}/images/{imageId}/delete(id=${tour.id},imageId=${img.id})}" method="post" style="position:absolute;top:8px;right:8px;">
          <input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}">
          <button type="submit" class="btn-sm-danger">Удалить</button>
        </form>
      </div>
    </div>
  </div>

</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/custom.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
