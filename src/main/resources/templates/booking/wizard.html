<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Бронирование — TourKG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div style="background:#fff;border-bottom:1px solid #E5E7EB;padding:20px 0;">
  <div class="container">
    <div style="font-size:.85rem;color:#6B7280;margin-bottom:4px;">
      <a th:href="@{/tours}" style="color:#6B7280;text-decoration:none;">Туры</a> ›
      <a th:href="@{/tours/{id}(id=${tour.id})}" style="color:#6B7280;text-decoration:none;" th:text="${tour.title}"></a> ›
      Бронирование
    </div>
    <h1 style="font-size:1.4rem;font-weight:800;margin:0;">Оформление брони</h1>
  </div>
</div>

<div class="container" style="padding:32px 12px;max-width:760px;">

  <!-- Wizard steps -->
  <div class="wizard-steps mb-4">
    <div class="wizard-step">
      <div class="wizard-step-num active" id="stepNum1">1</div>
      <div class="wizard-step-label">Данные</div>
    </div>
    <div class="wizard-step-line" id="stepLine1"></div>
    <div class="wizard-step">
      <div class="wizard-step-num waiting" id="stepNum2">2</div>
      <div class="wizard-step-label">Подтверждение</div>
    </div>
    <div class="wizard-step-line" id="stepLine2"></div>
    <div class="wizard-step">
      <div class="wizard-step-num waiting" id="stepNum3">3</div>
      <div class="wizard-step-label">Оплата</div>
    </div>
    <div class="wizard-step-line" id="stepLine3"></div>
    <div class="wizard-step">
      <div class="wizard-step-num waiting" id="stepNum4">
        <i data-lucide="check" style="width:14px;height:14px;"></i>
      </div>
      <div class="wizard-step-label">Готово</div>
    </div>
  </div>

  <!-- Tour info card -->
  <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:16px;margin-bottom:24px;display:flex;gap:16px;align-items:center;">
    <div style="width:56px;height:56px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2563EB,#059669);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <img th:if="${tour.coverImage != null}" th:src="@{/tours/{id}/cover(id=${tour.id})}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;" alt="">
      <i th:unless="${tour.coverImage != null}" data-lucide="plane" style="width:28px;height:28px;color:#fff;"></i>
    </div>
    <div>
      <div style="font-weight:700;" th:text="${tour.title}"></div>
      <div style="font-size:.82rem;color:#6B7280;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;">
        <span><i data-lucide="map-pin" style="width:12px;height:12px;"></i> <span th:text="${tour.destination}"></span></span>
        <span><i data-lucide="calendar" style="width:12px;height:12px;"></i> <span th:text="${#temporals.format(tourDate.departureDate,'dd.MM.yyyy')}"></span> – <span th:text="${#temporals.format(tourDate.returnDate,'dd.MM.yyyy')}"></span></span>
        <span><i data-lucide="armchair" style="width:12px;height:12px;"></i> <span th:text="${tourDate.availableSeats}"></span> мест доступно</span>
      </div>
    </div>
  </div>

  <form th:action="@{/booking/create}" method="post" id="bookingForm">
    <input type="hidden" name="tourDateId" th:value="${tourDate.id}">

    <!-- STEP 1 -->
    <div id="step1">
      <div class="tkg-card mb-3">
        <div class="tkg-card-header">
          <i data-lucide="users" style="width:16px;height:16px;margin-right:6px;"></i> Участники
        </div>
        <div class="tkg-card-body">
          <label class="form-label fw-semibold">Количество участников</label>
          <div class="d-flex align-items-center gap-3 mb-3">
            <button type="button" onclick="changeParticipants(-1)"
                    style="width:40px;height:40px;border-radius:50%;border:2px solid #E5E7EB;background:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;"
                    onmouseover="this.style.borderColor='#2563EB'" onmouseout="this.style.borderColor='#E5E7EB'">−</button>
            <div style="font-size:1.5rem;font-weight:800;min-width:40px;text-align:center;" id="participantsDisplay">1</div>
            <button type="button" onclick="changeParticipants(1)"
                    style="width:40px;height:40px;border-radius:50%;border:2px solid #E5E7EB;background:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;"
                    onmouseover="this.style.borderColor='#2563EB'" onmouseout="this.style.borderColor='#E5E7EB'">+</button>
            <input type="hidden" name="participants" id="participantsInput" value="1"
                   th:attr="data-max=${tourDate.availableSeats},data-price=${tour.price}">
          </div>
          <div style="font-size:.82rem;color:#6B7280;">Максимум <span th:text="${tourDate.availableSeats > 10 ? 10 : tourDate.availableSeats}"></span> мест</div>
        </div>
      </div>
      <div class="tkg-card mb-4">
        <div class="tkg-card-header">
          <i data-lucide="message-square" style="width:16px;height:16px;margin-right:6px;"></i> Примечания
        </div>
        <div class="tkg-card-body">
          <textarea name="notes" class="form-control" rows="2" placeholder="Особые пожелания, вопросы к оператору..."></textarea>
        </div>
      </div>
      <button type="button" class="btn-accent-tkg w-100 justify-content-center" style="padding:14px;font-size:1rem;" onclick="goWizardStep(2)">
        Далее →
      </button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" style="display:none;">
      <div class="tkg-card mb-4">
        <div class="tkg-card-header">
          <i data-lucide="receipt" style="width:16px;height:16px;margin-right:6px;"></i> Итого к оплате
        </div>
        <div class="tkg-card-body">
          <table style="width:100%;font-size:.9rem;">
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:10px 0;color:#6B7280;">Тур</td>
              <td style="padding:10px 0;font-weight:600;text-align:right;" th:text="${tour.title}"></td>
            </tr>
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:10px 0;color:#6B7280;">Дата вылета</td>
              <td style="padding:10px 0;text-align:right;" th:text="${#temporals.format(tourDate.departureDate,'dd MMMM yyyy')}"></td>
            </tr>
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:10px 0;color:#6B7280;">Участников</td>
              <td style="padding:10px 0;text-align:right;font-weight:600;" id="summaryParticipants">1 чел.</td>
            </tr>
            <tr style="border-bottom:1px solid #F3F4F6;">
              <td style="padding:10px 0;color:#6B7280;">Цена за чел.</td>
              <td style="padding:10px 0;text-align:right;" th:text="${#numbers.formatDecimal(tour.price,0,'COMMA',0,'POINT')} + ' сом'"></td>
            </tr>
            <tr>
              <td style="padding:14px 0 0;font-weight:700;font-size:1rem;">Итого</td>
              <td style="padding:14px 0 0;text-align:right;font-weight:900;font-size:1.3rem;color:#2563EB;"
                  id="summaryTotal" th:attr="data-price=${tour.price}">0 сом</td>
            </tr>
          </table>
        </div>
      </div>
      <div class="d-flex gap-3">
        <button type="button" class="btn-ghost-tkg flex-fill justify-content-center" style="padding:13px;" onclick="goWizardStep(1)">← Назад</button>
        <button type="submit" class="btn-accent-tkg flex-fill justify-content-center" style="padding:13px;font-size:1rem;">
          <i data-lucide="check-circle" style="width:18px;height:18px;margin-right:6px;"></i>
          Подтвердить и перейти к оплате
        </button>
      </div>
    </div>
  </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/custom.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
