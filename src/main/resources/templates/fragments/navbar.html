<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="navbar">

<!-- NAVBAR -->
<nav class="tkg-navbar navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Tour<span>KG</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item"><a class="nav-link" th:href="@{/}" data-i18n="nav.home">Главная</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/tours}" data-i18n="nav.tours">Туры</a></li>
        <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
          <a class="nav-link" th:href="@{/operator}" data-i18n="nav.operator">Кабинет оператора</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin}" data-i18n="nav.admin">Админ</a>
        </li>
      </ul>

      <!-- Language switcher -->
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang-btn="ru" onclick="TKG_I18N.setLang('ru')">RU</button>
        <button type="button" class="lang-btn" data-lang-btn="kg" onclick="TKG_I18N.setLang('kg')">KG</button>
      </div>

      <div class="d-flex align-items-center gap-2 ms-2" sec:authorize="isAuthenticated()">
        <a class="nav-link" th:href="@{/cabinet}" sec:authorize="hasRole('TOURIST')"
           style="font-weight:600;font-size:.9rem;color:#059669;">
          <span sec:authentication="name"></span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn-ghost-tkg" type="submit" style="padding:7px 16px;font-size:.85rem;" data-i18n="nav.logout">Выйти</button>
        </form>
      </div>
      <div class="d-flex align-items-center gap-2 ms-2" sec:authorize="!isAuthenticated()">
        <button class="btn-ghost-tkg" style="padding:8px 18px;font-size:.9rem;"
                onclick="openAuthModal('login')" data-i18n="nav.login">
          Войти
        </button>
        <button class="btn-primary-tkg" style="padding:8px 18px;font-size:.9rem;"
                onclick="openAuthModal('register')" data-i18n="nav.register">
          Регистрация
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- AUTH MODAL -->
<div class="modal fade tkg-modal" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog auth-modal-dialog">
    <div class="modal-content auth-modal-content">

      <!-- Header -->
      <div class="modal-header auth-modal-header">
        <div>
          <div class="modal-title" style="font-size:1.05rem;" data-i18n="auth.welcome">Добро пожаловать в TourKG</div>
          <div style="font-size:.78rem;color:rgba(255,255,255,.65);margin-top:2px;" data-i18n="auth.subtitle">Войдите или создайте аккаунт</div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body p-0">
        <!-- Tabs -->
        <div class="auth-tabs-wrap">
          <div class="auth-tabs">
            <button id="tabLoginBtn" class="auth-tab active" onclick="showAuthTab('login')" data-i18n="auth.tab.login">Вход</button>
            <button id="tabRegisterBtn" class="auth-tab" onclick="showAuthTab('register')" data-i18n="auth.tab.register">Регистрация</button>
          </div>
        </div>

        <!-- Alerts -->
        <div id="authAlert"   style="display:none;" class="tkg-alert tkg-alert-danger auth-alert"></div>
        <div id="authSuccess" style="display:none;" class="tkg-alert tkg-alert-success auth-alert"></div>

        <!-- LOGIN -->
        <div id="tabLogin" class="auth-form-wrap">
          <form id="loginForm" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="loginCsrf">
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.email">Email</label>
              <input type="email" name="username" class="form-control auth-input" required
                     placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.password">Пароль</label>
              <input type="password" name="password" class="form-control auth-input" required
                     placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="loginSubmitBtn"
                    class="btn-primary-tkg w-100 justify-content-center auth-submit" data-i18n="auth.loginBtn">
              Войти
            </button>
            <div class="auth-hint" data-i18n="auth.testHint">
              Тест: tourist@tour.kg / tourist123
            </div>
          </form>
        </div>

        <!-- REGISTER -->
        <div id="tabRegister" class="auth-form-wrap" style="display:none;">
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.fullName">Полное имя</label>
              <input type="text" name="fullName" class="form-control auth-input" required placeholder="Айбек Айбеков">
            </div>
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.email">Email</label>
              <input type="email" name="email" class="form-control auth-input" required placeholder="your@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.phone">Телефон</label>
              <input type="text" name="phone" class="form-control auth-input" placeholder="+996 700 000 000">
            </div>
            <div class="mb-3">
              <label class="form-label auth-label" data-i18n="auth.password">Пароль</label>
              <input type="password" name="password" class="form-control auth-input" required
                     placeholder="Минимум 6 символов" data-i18n-placeholder="auth.passMin" minlength="6">
            </div>
            <button type="submit" id="registerSubmitBtn"
                    class="btn-accent-tkg w-100 justify-content-center auth-submit" data-i18n="auth.registerBtn">
              Создать аккаунт
            </button>
          </form>
        </div>
      </div><!-- /modal-body -->
    </div>
  </div>
</div>

<style>
/* ── AUTH MODAL RESPONSIVE ───────────────────────── */
.auth-modal-dialog {
  max-width: 400px;
  margin: 72px auto 16px;
  padding: 0 12px;
}
.auth-modal-content {
  border-radius: 20px !important;
  overflow: hidden;
  border: none;
  box-shadow: 0 24px 64px rgba(0,0,0,.22);
}
.auth-modal-header {
  padding: 18px 22px !important;
}
.auth-tabs-wrap {
  padding: 14px 18px 0;
  background: #fff;
  border-bottom: 1px solid #F1F5F9;
}
.auth-tabs {
  display: flex;
  gap: 4px;
  background: #F1F5F9;
  border-radius: 10px;
  padding: 4px;
}
.auth-tab {
  flex: 1;
  padding: 8px 10px;
  border: none;
  border-radius: 7px;
  font-weight: 600;
  font-size: .87rem;
  cursor: pointer;
  transition: all .2s;
  background: transparent;
  color: #64748B;
}
.auth-tab.active {
  background: #fff;
  color: #059669;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

/* ── LANGUAGE SWITCHER ─────────────────────────── */
.lang-switch {
  display: inline-flex;
  background: #F1F5F9;
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.lang-btn {
  border: none;
  background: transparent;
  color: #64748B;
  font-weight: 700;
  font-size: .78rem;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .18s ease;
  letter-spacing: .4px;
  font-family: inherit;
}
.lang-btn:hover { color: #059669; }
.lang-btn.active {
  background: #fff;
  color: #059669;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
@media (max-width: 991px) {
  .lang-switch { margin: 8px 0; align-self: flex-start; }
}
.auth-alert {
  margin: 10px 18px 0;
  padding: 10px 14px;
  font-size: .84rem;
}
.auth-form-wrap {
  padding: 16px 18px 20px;
}
.auth-label {
  font-size: .8rem !important;
  font-weight: 600 !important;
  color: #334155 !important;
  margin-bottom: 5px !important;
}
.auth-input {
  padding: 9px 12px !important;
  font-size: .9rem !important;
  border-radius: 9px !important;
}
.auth-submit {
  padding: 11px !important;
  font-size: .93rem !important;
  border-radius: 9px !important;
}
.auth-hint {
  margin-top: 10px;
  text-align: center;
  font-size: .74rem;
  color: #94A3B8;
  background: #F8FAFC;
  padding: 7px 10px;
  border-radius: 7px;
}

/* Телефон и маленькие окна */
@media (max-width: 480px) {
  .auth-modal-dialog {
    margin: 0;
    padding: 0;
    max-width: 100%;
    min-height: 100%;
    display: flex;
    align-items: flex-end;
  }
  .auth-modal-content {
    border-radius: 20px 20px 0 0 !important;
    width: 100%;
  }
}
</style>

<!-- Client-side i18n -->
<script th:src="@{/js/i18n.js}"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var toggler = document.querySelector('.navbar-toggler');
  var navbar = document.querySelector('.tkg-navbar');
  if (toggler && navbar) {
    // apply class on pointerdown so overlay appears before collapse animation
    toggler.addEventListener('pointerdown', function(){ navbar.classList.add('menu-open-immediate'); });
    // remove overlay when menu has actually opened or closed
    document.addEventListener('shown.bs.collapse', function(e){ if (e.target.classList && e.target.classList.contains('navbar-collapse')) { navbar.classList.remove('menu-open-immediate'); } });
    document.addEventListener('hidden.bs.collapse', function(e){ if (e.target.classList && e.target.classList.contains('navbar-collapse')) { navbar.classList.remove('menu-open-immediate'); } });
  }
});
</script>

</div><!-- end th:fragment="navbar" -->

</body>
</html>
