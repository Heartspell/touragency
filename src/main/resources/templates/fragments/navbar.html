<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="navbar">

<!-- NAVBAR -->
<nav class="tkg-navbar navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Tour<span>KG</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/tours}">Туры</a></li>
        <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
          <a class="nav-link" th:href="@{/operator}">Кабинет оператора</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin}">Админ</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
        <a class="nav-link" th:href="@{/cabinet}" sec:authorize="hasRole('TOURIST')"
           style="font-weight:600;font-size:.9rem;color:#2563EB;">
          <span sec:authentication="name"></span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn-ghost-tkg" type="submit" style="padding:7px 16px;font-size:.85rem;">Выйти</button>
        </form>
      </div>
      <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
        <button class="btn-ghost-tkg" style="padding:8px 18px;font-size:.9rem;"
                onclick="openAuthModal('login')">
          Войти
        </button>
        <button class="btn-primary-tkg" style="padding:8px 18px;font-size:.9rem;"
                onclick="openAuthModal('register')">
          Регистрация
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- AUTH MODAL (включён в тот же фрагмент) -->
<div class="modal fade tkg-modal" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog" style="max-width:420px;margin-top:80px;">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title">Добро пожаловать в TourKG</div>
          <div style="font-size:.82rem;color:rgba(255,255,255,.7);margin-top:2px;">Войдите или создайте аккаунт</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <!-- Tabs -->
        <div style="padding:20px 28px 0;border-bottom:1px solid #F3F4F6;">
          <div class="d-flex gap-1">
            <button id="tabLoginBtn"
                    onclick="showAuthTab('login')"
                    style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;background:#EFF6FF;color:#2563EB;">
              Вход
            </button>
            <button id="tabRegisterBtn"
                    onclick="showAuthTab('register')"
                    style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;background:transparent;color:#6B7280;">
              Регистрация
            </button>
          </div>
        </div>

        <!-- Alerts -->
        <div id="authAlert"  style="display:none;margin:12px 28px 0;" class="tkg-alert tkg-alert-danger"></div>
        <div id="authSuccess" style="display:none;margin:12px 28px 0;" class="tkg-alert tkg-alert-success"></div>

        <!-- LOGIN -->
        <div id="tabLogin" style="padding:20px 28px 28px;">
          <form id="loginForm" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="loginCsrf">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="username" class="form-control" required
                     placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="mb-4">
              <label class="form-label">Пароль</label>
              <input type="password" name="password" class="form-control" required
                     placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" id="loginSubmitBtn"
                    class="btn-primary-tkg w-100 justify-content-center" style="padding:13px;">
              Войти
            </button>
            <div style="margin-top:14px;text-align:center;font-size:.78rem;color:#9CA3AF;background:#F9FAFB;padding:8px 12px;border-radius:8px;">
              🔑 tourist@tour.kg / tourist123
            </div>
          </form>
        </div>

        <!-- REGISTER -->
        <div id="tabRegister" style="display:none;padding:20px 28px 28px;">
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label">Полное имя</label>
              <input type="text" name="fullName" class="form-control" required placeholder="Иван Иванов">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required placeholder="your@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Телефон</label>
              <input type="text" name="phone" class="form-control" placeholder="+996 700 000 000">
            </div>
            <div class="mb-4">
              <label class="form-label">Пароль</label>
              <input type="password" name="password" class="form-control" required
                     placeholder="Минимум 6 символов" minlength="6">
            </div>
            <button type="submit" id="registerSubmitBtn"
                    class="btn-accent-tkg w-100 justify-content-center" style="padding:13px;">
              Создать аккаунт
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var toggler = document.querySelector('.navbar-toggler');
  var navbar = document.querySelector('.tkg-navbar');
  if (toggler && navbar) {
    // apply class on pointerdown so overlay appears before collapse animation
    toggler.addEventListener('pointerdown', function(){ navbar.classList.add('menu-open-immediate'); });
    // remove overlay when menu has actually opened or closed
    document.addEventListener('shown.bs.collapse', function(e){ if (e.target.classList && e.target.classList.contains('navbar-collapse')) { navbar.classList.remove('menu-open-immediate'); } });
    document.addEventListener('hidden.bs.collapse', function(e){ if (e.target.classList && e.target.classList.contains('navbar-collapse')) { navbar.classList.remove('menu-open-immediate'); } });
  }
});
</script>

</div><!-- end th:fragment="navbar" -->

</body>
</html>
