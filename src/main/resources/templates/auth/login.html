<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — TourKG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body style="background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;">
<div style="width:100%;max-width:420px;margin:24px;">
  <div style="text-align:center;margin-bottom:24px;">
    <a th:href="@{/}" style="font-size:2rem;font-weight:900;color:#fff;text-decoration:none;">Tour<span style="color:#F97316;">KG</span></a>
  </div>
  <div style="background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25);">
    <div style="padding:28px 32px 0;">
      <div style="font-size:1.3rem;font-weight:800;margin-bottom:4px;">Вход в аккаунт</div>
      <div style="font-size:.85rem;color:#6B7280;margin-bottom:20px;">Используйте email и пароль</div>
      <div th:if="${param.error}" class="tkg-alert tkg-alert-danger">Неверный email или пароль</div>
      <div th:if="${success}" class="tkg-alert tkg-alert-success" th:text="${success}"></div>
    </div>
    <div style="padding:0 32px 32px;">
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" style="font-size:.85rem;font-weight:600;">Email</label>
          <input type="email" name="username" class="form-control" required autofocus placeholder="your@email.com" style="border-radius:10px;padding:12px 14px;border:1.5px solid #E5E7EB;">
        </div>
        <div class="mb-4">
          <label class="form-label" style="font-size:.85rem;font-weight:600;">Пароль</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••" style="border-radius:10px;padding:12px 14px;border:1.5px solid #E5E7EB;">
        </div>
        <button type="submit" class="btn-primary-tkg w-100 justify-content-center" style="padding:13px;font-size:1rem;">Войти</button>
      </form>
      <div style="margin-top:16px;text-align:center;font-size:.78rem;color:#9CA3AF;background:#F9FAFB;padding:10px;border-radius:8px;">
        🔑 tourist@tour.kg / tourist123<br>operator@tour.kg / operator123
      </div>
      <div style="text-align:center;margin-top:16px;font-size:.85rem;">
        <a th:href="@{/}" style="color:#6B7280;text-decoration:none;">← На главную</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
