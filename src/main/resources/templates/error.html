<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка — TourKG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container" style="padding:64px 12px;">
  <div class="tkg-card" style="max-width:680px;margin:0 auto;">
    <div class="tkg-card-body" style="text-align:center;padding:40px 24px;">
      <div style="width:64px;height:64px;border-radius:16px;background:#FEF2F2;color:#EF4444;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
        <i data-lucide="triangle-alert" style="width:34px;height:34px;"></i>
      </div>
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:10px;">Что-то пошло не так</h1>
      <p style="color:#64748B;margin:0 auto 22px;max-width:520px;">
        Сайт не смог выполнить действие. Вернитесь назад и попробуйте ещё раз.
      </p>
      <div style="font-size:.9rem;color:#94A3B8;margin-bottom:24px;">
        Код ошибки: <strong th:text="${status ?: '500'}">500</strong>
      </div>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a th:href="@{/}" class="btn-primary-tkg">На главную</a>
        <button type="button" class="btn-ghost-tkg" onclick="history.back()">Назад</button>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/custom.js}"></script>
<script>lucide.createIcons();</script>
</body>
</html>
