<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тур — КыргызТур</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0" style="color:#1F3864;">
          <i class="bi bi-map"></i>
          <span th:if="${tour == null}">Создать тур</span>
          <span th:if="${tour != null}">Редактировать тур</span>
        </h2>
        <a th:href="@{/operator}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left"></i> Назад
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form th:action="${tour == null ? '/operator/tours' : '/operator/tours/' + tour.id + '/update'}"
                method="post">

            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Название тура *</label>
                <input type="text" name="title" class="form-control"
                       placeholder="Например: Анталья — Солнечный берег"
                       th:value="${tour?.title}" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Описание *</label>
                <textarea name="description" class="form-control" rows="4"
                          placeholder="Подробное описание тура..."
                          required th:text="${tour?.description}"></textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Направление *</label>
                <input type="text" name="destination" class="form-control"
                       placeholder="Город, курорт"
                       th:value="${tour?.destination}" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Страна *</label>
                <input type="text" name="country" class="form-control"
                       placeholder="Страна"
                       th:value="${tour?.country}" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Длительность (дней) *</label>
                <input type="number" name="durationDays" class="form-control"
                       min="1" max="365"
                       th:value="${tour?.durationDays ?: 7}" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Цена (сом) *</label>
                <input type="number" name="price" class="form-control"
                       min="0" step="100"
                       th:value="${tour?.price}" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Категория *</label>
                <select name="category" class="form-select" required>
                  <option th:each="cat : ${categories}"
                          th:value="${cat.name()}"
                          th:text="${cat.name()}"
                          th:selected="${tour != null and tour.category == cat}">
                  </option>
                </select>
              </div>

              <div class="col-md-6" th:if="${tour != null}">
                <label class="form-label fw-semibold">Статус</label>
                <select name="status" class="form-select">
                  <option value="ACTIVE" th:selected="${tour.status.name() == 'ACTIVE'}">ACTIVE</option>
                  <option value="DRAFT" th:selected="${tour.status.name() == 'DRAFT'}">DRAFT</option>
                  <option value="ARCHIVED" th:selected="${tour.status.name() == 'ARCHIVED'}">ARCHIVED</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a th:href="@{/operator}" class="btn btn-outline-secondary">Отмена</a>
              <button type="submit" class="btn btn-primary fw-bold px-4">
                <i class="bi bi-check-lg"></i>
                <span th:if="${tour == null}">Создать тур</span>
                <span th:if="${tour != null}">Сохранить изменения</span>
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
