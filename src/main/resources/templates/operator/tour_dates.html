<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Даты тура — КыргызТур</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0" style="color:#1F3864;">
        <i class="bi bi-calendar3"></i> Даты тура
      </h2>
      <p class="text-muted mb-0" th:text="${tour.title}"></p>
    </div>
    <a th:href="@{/operator}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Назад
    </a>
  </div>

  <div class="row g-4">
    <!-- Add Date Form -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header fw-bold" style="background-color:#1F3864; color:white;">
          <i class="bi bi-plus-circle"></i> Добавить дату
        </div>
        <div class="card-body">
          <form th:action="@{/operator/tours/{id}/dates(id=${tour.id})}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Дата вылета</label>
              <input type="date" name="departureDate" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Дата возврата</label>
              <input type="date" name="returnDate" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Количество мест</label>
              <input type="number" name="totalSeats" class="form-control"
                     value="20" min="1" max="500" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-plus-lg"></i> Добавить
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Dates Table -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header fw-bold" style="background-color:#1F3864; color:white;">
          <i class="bi bi-list-ul"></i> Список дат (<span th:text="${dates.size()}">0</span>)
        </div>
        <div class="card-body p-0">
          <div th:if="${dates.empty}" class="text-center py-4 text-muted">
            <i class="bi bi-calendar-x fs-2"></i>
            <p class="mt-2">Нет дат. Добавьте первую дату.</p>
          </div>
          <table th:if="${!dates.empty}" class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Дата вылета</th>
                <th>Дата возврата</th>
                <th>Всего мест</th>
                <th>Забронировано</th>
                <th>Свободно</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="d : ${dates}">
                <td th:text="${#temporals.format(d.departureDate,'dd.MM.yyyy')}"></td>
                <td th:text="${#temporals.format(d.returnDate,'dd.MM.yyyy')}"></td>
                <td th:text="${d.totalSeats}"></td>
                <td th:text="${d.bookedSeats}"></td>
                <td>
                  <span th:text="${d.availableSeats}"
                        th:classappend="${d.availableSeats == 0} ? 'text-danger fw-bold' : 'text-success fw-bold'">
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
